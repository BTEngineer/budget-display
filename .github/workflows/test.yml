name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: household_budget_mcp
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
