name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: household_budget_mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify hashed production requirements
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Audit locked dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: household_budget_mcp/requirements.lock
          require-hashes: true
          no-deps: true
          disable-pip: true
