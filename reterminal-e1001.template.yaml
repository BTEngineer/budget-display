substitutions:
  device_name: reterminal-e1001
  friendly_name: reTerminal E1001

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_measure_enable
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
        - lambda: |-
            const uint64_t wake_pins = esp_sleep_get_ext1_wakeup_status();
            const bool woke_from_green_button =
                (wake_pins & (1ULL << 3)) != 0;
            if (woke_from_green_button && !id(green_wake_processed)) {
              id(show_budget_page) = !id(show_budget_page);
              id(green_wake_processed) = true;
            }
    - priority: -100
      then:
        - delay: 20s
        - lambda: |-
            if (id(show_budget_page)) {
              id(epaper_display).show_page(id(budget_page));
            } else {
              id(epaper_display).show_page(id(home_page));
            }
        - component.update: epaper_display
        - lambda: id(boot_display_ready) = true;

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "REPLACE_WITH_GENERATED_API_KEY"

ota:
  - platform: esphome
    password: "REPLACE_WITH_GENERATED_OTA_PASSWORD"

# Must be shorter than deep_sleep.run_duration so an OTA image is marked
# successful before the device sleeps.
safe_mode:
  boot_is_good_after: 30s

wifi:
  ap:
    ssid: "reTerminal-E1001 Setup"
    password: "REPLACE_WITH_GENERATED_AP_PASSWORD"

captive_portal:

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

output:
  - platform: gpio
    pin: GPIO21
    id: battery_measure_enable

globals:
  # The selected page survives deep sleep so scheduled wakes refresh the page
  # that was already visible. The green wake button toggles it once per press.
  - id: show_budget_page
    type: bool
    restore_value: true
    initial_value: "false"
  - id: green_wake_processed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: boot_display_ready
    type: bool
    restore_value: false
    initial_value: "false"

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: Battery Voltage
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: Battery Level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: never
    lambda: return id(battery_voltage).state;
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: homeassistant
    id: budget_spent
    entity_id: sensor.household_budget_spent_month

  - platform: homeassistant
    id: budget_remaining
    entity_id: sensor.household_budget_remaining_month

  - platform: homeassistant
    id: budget_person_1
    entity_id: sensor.household_budget_person_1_month

  - platform: homeassistant
    id: budget_person_2
    entity_id: sensor.household_budget_person_2_month

text_sensor:
  - platform: homeassistant
    id: budget_category_1
    entity_id: sensor.household_budget_category_1_month
  - platform: homeassistant
    id: budget_category_2
    entity_id: sensor.household_budget_category_2_month
  - platform: homeassistant
    id: budget_category_3
    entity_id: sensor.household_budget_category_3_month
  - platform: homeassistant
    id: budget_category_4
    entity_id: sensor.household_budget_category_4_month
  - platform: homeassistant
    id: budget_category_5
    entity_id: sensor.household_budget_category_5_month
  - platform: homeassistant
    id: budget_category_6
    entity_id: sensor.household_budget_category_6_month

binary_sensor:
  - platform: gpio
    id: next_button
    name: Green Page Toggle Button
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      then:
        - lambda: |-
            const uint64_t wake_pins = esp_sleep_get_ext1_wakeup_status();
            const bool this_boot_woke_from_green_button =
                (wake_pins & (1ULL << 3)) != 0;
            const bool duplicate_boot_press =
                !id(boot_display_ready) &&
                this_boot_woke_from_green_button &&
                id(green_wake_processed);
            if (!duplicate_boot_press) {
              id(show_budget_page) = !id(show_budget_page);
              if (!id(boot_display_ready) &&
                  this_boot_woke_from_green_button) {
                id(green_wake_processed) = true;
              }
            }
            if (id(show_budget_page)) {
              id(epaper_display).show_page(id(budget_page));
            } else {
              id(epaper_display).show_page(id(home_page));
            }
        - if:
            condition:
              lambda: return id(boot_display_ready);
            then:
              - component.update: battery_voltage
              - component.update: battery_level
              - component.update: epaper_display

  - platform: gpio
    id: refresh_button
    name: Right Refresh Button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      then:
        - component.update: battery_voltage
        - component.update: battery_level
        - component.update: epaper_display

  - platform: gpio
    id: previous_button
    name: Left Refresh Button
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      then:
        - component.update: epaper_display

time:
  - platform: homeassistant
    id: ha_time

font:
  - file: "gfonts://Inter@400"
    id: body_font
    size: 18
    glyphsets: []
    glyphs:
      - " 0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "$%.,!?()-/:<>"
  - file: "gfonts://Inter@700"
    id: bold_body_font
    size: 18
    glyphsets: []
    glyphs:
      - " 0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "$%.,!?()-/:<>"
  - file: "gfonts://Inter@700"
    id: heading_font
    size: 30
    glyphsets: []
    glyphs:
      - " 0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "$%.,!?()-/:<>"
  - file: "gfonts://Inter@700"
    id: value_font
    size: 38
    glyphsets: []
    glyphs:
      - " 0123456789"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      - "abcdefghijklmnopqrstuvwxyz"
      - "$%.,!?()-/:<>"
  - file: "gfonts://Inter@700"
    id: home_time_font
    size: 76
    glyphsets: []
    glyphs:
      - " 0123456789"
      - ":AMP"

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    pages:
      - id: home_page
        lambda: |-
          auto now = id(ha_time).now();
          it.print(24, 18, id(heading_font), "HOUSEHOLD HOME");
          if (isnan(id(battery_level).state)) {
            it.print(776, 22, id(body_font), TextAlign::TOP_RIGHT,
                     "Battery --");
          } else {
            it.printf(776, 22, id(body_font), TextAlign::TOP_RIGHT,
                      "Battery %.0f%%", id(battery_level).state);
          }
          it.line(24, 70, 776, 70);

          if (now.is_valid()) {
            it.strftime(400, 122, id(home_time_font), TextAlign::TOP_CENTER,
                        "%I:%M %p", now);
            it.strftime(400, 220, id(heading_font), TextAlign::TOP_CENTER,
                        "%A", now);
            it.strftime(400, 270, id(body_font), TextAlign::TOP_CENTER,
                        "%B %d, %Y", now);
          } else {
            it.print(400, 175, id(heading_font), TextAlign::TOP_CENTER,
                     "CONNECTING...");
            it.print(400, 235, id(body_font), TextAlign::TOP_CENTER,
                     "Waiting for Home Assistant time.");
          }

          it.line(24, 420, 776, 420);
          it.print(776, 447, id(body_font), TextAlign::TOP_RIGHT,
                   "Green: Budget  |  Side buttons: Refresh");

      - id: budget_page
        lambda: |-
          auto now = id(ha_time).now();
          it.printf(24, 18, id(heading_font), "HOUSEHOLD BUDGET");
          if (now.is_valid()) {
            it.strftime(776, 22, id(body_font), TextAlign::TOP_RIGHT,
                        "%B %Y", now);
          }
          it.line(24, 70, 776, 70);

          if (isnan(id(budget_spent).state) ||
              isnan(id(budget_remaining).state) ||
              isnan(id(budget_person_1).state) ||
              isnan(id(budget_person_2).state)) {
            it.print(400, 180, id(heading_font), TextAlign::TOP_CENTER,
                     "BUDGET SERVICE NOT CONNECTED");
            it.print(400, 245, id(body_font), TextAlign::TOP_CENTER,
                     "Waiting for budget sensors.");
            it.print(400, 285, id(body_font), TextAlign::TOP_CENTER,
                     "Budget totals will appear here after setup.");
          } else {
            it.print(24, 82, id(body_font), "Spent");
            it.printf(24, 104, id(value_font), "$%.2f",
                      id(budget_spent).state);
            it.print(430, 82, id(body_font), "Remaining");
            it.printf(430, 104, id(value_font), "$%.2f",
                      id(budget_remaining).state);

            it.print(24, 158, id(body_font), "Category");
            it.print(360, 158, id(body_font), TextAlign::TOP_RIGHT, "Budget");
            it.print(495, 158, id(body_font), TextAlign::TOP_RIGHT, "Member 1");
            it.print(650, 158, id(body_font), TextAlign::TOP_RIGHT, "Member 2");
            it.print(776, 158, id(body_font), TextAlign::TOP_RIGHT, "Total");
            it.line(24, 182, 776, 182);

            std::array<std::string, 6> raw_rows = {
              id(budget_category_1).state,
              id(budget_category_2).state,
              id(budget_category_3).state,
              id(budget_category_4).state,
              id(budget_category_5).state,
              id(budget_category_6).state,
            };
            int visible_row = 0;
            for (const auto &raw : raw_rows) {
              std::vector<std::string> fields;
              size_t start = 0;
              while (fields.size() < 5) {
                size_t separator = raw.find('|', start);
                if (separator == std::string::npos) break;
                fields.push_back(raw.substr(start, separator - start));
                start = separator + 1;
              }
              fields.push_back(raw.substr(start));
              if (fields.size() != 6 || fields[1].empty()) continue;

              int y = 191 + visible_row * 31;
              const bool child = fields[0] == "1";
              const bool has_budget = !fields[2].empty();
              const float row_budget =
                  has_budget ? strtof(fields[2].c_str(), nullptr) : 0.0f;
              const float row_total = strtof(fields[5].c_str(), nullptr);
              if (child) {
                it.printf(38, y, id(body_font), "> %s", fields[1].c_str());
              } else {
                it.print(24, y, id(body_font), fields[1].c_str());
              }
              if (!has_budget) {
                it.print(360, y, id(body_font), TextAlign::TOP_RIGHT, "--");
              } else {
                it.printf(360, y, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                          row_budget);
              }
              it.printf(495, y, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                        strtof(fields[3].c_str(), nullptr));
              it.printf(650, y, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                        strtof(fields[4].c_str(), nullptr));
              if (has_budget && row_total > row_budget) {
                it.printf(776, y, id(bold_body_font), TextAlign::TOP_RIGHT,
                          "$%.2f", row_total);
              } else {
                it.printf(776, y, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                          row_total);
              }
              visible_row++;
            }

            it.line(24, 382, 776, 382);
            it.print(24, 390, id(body_font), "TOTAL");
            it.printf(360, 390, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                      id(budget_spent).state + id(budget_remaining).state);
            it.printf(495, 390, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                      id(budget_person_1).state);
            it.printf(650, 390, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                      id(budget_person_2).state);
            it.printf(776, 390, id(body_font), TextAlign::TOP_RIGHT, "$%.2f",
                      id(budget_spent).state);
          }

          it.print(776, 447, id(body_font), TextAlign::TOP_RIGHT,
                   "Green: Home  |  Side buttons: Refresh");

deep_sleep:
  id: display_sleep
  run_duration:
    default: 90s
    gpio_wakeup_reason: 90s
  sleep_duration: 15min
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        allow_other_uses: true
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true
    mode: ANY_LOW
